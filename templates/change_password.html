<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Smart Disaster</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #12304d;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 310px;
            background: #123452;
            color: white;
            padding: 35px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            text-align: center;
            margin-bottom: 70px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #ff3344;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .logo h2 {
            margin-top: 18px;
            font-size: 24px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            padding: 18px 25px;
            border-radius: 12px;
            font-size: 17px;
        }

        .menu a:hover,
        .menu a.active {
            background: #f52f40;
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #ef2636;
            text-align: center;
        }

        .main {
            margin-left: 310px;
            width: calc(100% - 310px);
            padding: 55px 45px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b8097;
            font-size: 17px;
        }

        .user-badge {
            background: white;
            padding: 17px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            font-weight: bold;
        }

        .form-card {
            background: white;
            max-width: 750px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(20,50,80,0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 22px;
        }

        label {
            margin-bottom: 9px;
            font-weight: bold;
        }

        input {
            padding: 14px;
            border: 1px solid #d8e0e8;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff3344;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #ff3344;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #dc2535;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            padding: 14px 25px;
            border-radius: 10px;
            background: #e9eef4;
            color: #12304d;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #ffe1e4;
            color: #c51f30;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcf8e5;
            color: #16803c;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-circle">
                🛡️
            </div>

            <h2>Smart Disaster</h2>

        </div>

        <nav class="menu">

            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/sos">🆘 SOS Emergency</a>
            <a href="/alerts">🚨 Disaster Alerts</a>
            <a href="/shelters">🏠 Shelters</a>
            <a href="/map">🗺️ Live Map</a>
            <a href="/volunteer">🤝 Volunteer</a>
            <a href="/profile" class="active">👤 My Profile</a>
            <a href="/logout" class="logout">🚪 Logout</a>

        </nav>

    </aside>


    <main class="main">

        <div class="top">

            <div class="title">
                <h1>🔐 Change Password</h1>
                <p>Update your account password.</p>
            </div>

            <div class="user-badge">
                👤 User
            </div>

        </div>


        <div class="form-card">

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="success">
                    {{ success }}
                </div>
            {% endif %}


            <form method="POST" action="/change-password">

                <div class="form-group">

                    <label>Current Password</label>

                    <input
                        type="password"
                        name="current_password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>New Password</label>

                    <input
                        type="password"
                        name="new_password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm New Password</label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                    >

                </div>


                <button type="submit">
                    🔐 Change Password
                </button>

                <a href="/profile" class="back">
                    ← Back to Profile
                </a>

            </form>

        </div>

    </main>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Smart Disaster</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #12304d;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 310px;
            background: #123452;
            color: white;
            padding: 35px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            text-align: center;
            margin-bottom: 70px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #ff3344;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .logo h2 {
            margin-top: 18px;
            font-size: 24px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            padding: 18px 25px;
            border-radius: 12px;
            font-size: 17px;
        }

        .menu a:hover,
        .menu a.active {
            background: #f52f40;
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #ef2636;
            text-align: center;
        }

        /* MAIN */

        .main {
            margin-left: 310px;
            width: calc(100% - 310px);
            padding: 55px 45px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b8097;
            font-size: 17px;
        }

        .user-badge {
            background: white;
            padding: 17px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            font-weight: bold;
        }

        /* FORM */

        .form-card {
            background: white;
            max-width: 950px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(20,50,80,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 9px;
            font-weight: bold;
        }

        .form-group input {
            padding: 14px;
            border: 1px solid #d8e0e8;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff3344;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #ff3344;
            color: white;
        }

        .save:hover {
            background: #dc2535;
        }

        .cancel {
            background: #e9eef4;
            color: #12304d;
        }

        /* MOBILE */

        @media(max-width: 800px) {

            .sidebar {
                width: 220px;
            }

            .main {
                margin-left: 220px;
                width: calc(100% - 220px);
                padding: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-circle">
                🛡️
            </div>

            <h2>Smart Disaster</h2>

        </div>


        <nav class="menu">

            <a href="/dashboard">
                🏠 Dashboard
            </a>

            <a href="/sos">
                🆘 SOS Emergency
            </a>

            <a href="/alerts">
                🚨 Disaster Alerts
            </a>

            <a href="/shelters">
                🏠 Shelters
            </a>

            <a href="/map">
                🗺️ Live Map
            </a>

            <a href="/volunteer">
                🤝 Volunteer
            </a>

            <a href="/profile" class="active">
                👤 My Profile
            </a>

            <a href="/logout" class="logout">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="top">

            <div class="title">

                <h1>✏️ Edit Profile</h1>

                <p>
                    Update your personal information.
                </p>

            </div>


            <div class="user-badge">

                👤 {{ user.name }}

            </div>

        </div>


        <!-- FORM -->

        <div class="form-card">

            <form method="POST" action="/edit-profile">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            name="name"
                            value="{{ user.name }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            value="{{ user.email }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ user.phone }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>User Type</label>

                        <input
                            type="text"
                            value="{{ user.user_type }}"
                            readonly
                        >

                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save">
                        💾 Save Changes
                    </button>


                    <button
                        type="button"
                        class="cancel"
                        onclick="window.location.href='/profile'">
                        ← Cancel
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>

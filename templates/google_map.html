<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Risk Search Map</title>


<style>

body{
    margin:0;
    font-family:Arial;
}


#searchBox{

    padding:15px;

    background:#f5f5f5;

}


input{

    width:300px;

    padding:10px;

    font-size:16px;

}


button{

    padding:10px 20px;

    background:#e63946;

    color:white;

    border:none;

    cursor:pointer;

}


#map{

    height:700px;

    width:100%;

}


</style>


</head>


<body>


<div id="searchBox">

<input 
id="location"
placeholder="Search Bangladesh location..."
>


<button onclick="searchLocation()">
Search
</button>


</div>



<div id="map"></div>



<script 
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyArHxEof9W2FK2MEH4odGfOHXS0utfLXfo">
</script>



<script>


let map;


function initMap(){


map = new google.maps.Map(

document.getElementById("map"),

{

center:{
lat:23.6850,
lng:90.3563
},

zoom:7

}

);


}



let marker;


function searchLocation(){

let place = document.getElementById("location").value;


let geocoder = new google.maps.Geocoder();


geocoder.geocode(
{
    address: place + ", Bangladesh"
},


function(results,status){


if(status=="OK"){


let location = results[0].geometry.location;



map.setCenter(location);

map.setZoom(12);



if(marker){
    marker.setMap(null);
}



marker = new google.maps.Marker({

position:location,

map:map,

title:place,

icon:{
    url:"http://maps.google.com/mapfiles/ms/icons/red-dot.png"
}


});



// load risk data

loadRiskData(
location.lat(),
location.lng()
);



}

else{

alert("Location not found");

}


});


}

function loadRiskData(lat,lng){


fetch("/api/disasters")

.then(response=>response.json())

.then(data=>{


data.forEach(function(item){



let distance =
Math.sqrt(
Math.pow(lat-item.latitude,2)+
Math.pow(lng-item.longitude,2)
);



if(distance < 1){



let color="green";


if(item.severity=="High")
{
color="red";
}

else if(item.severity=="Medium")
{
color="orange";
}



new google.maps.Marker({

position:{
lat:parseFloat(item.latitude),
lng:parseFloat(item.longitude)
},


map:map,


icon:{
url:
"https://maps.google.com/mapfiles/ms/icons/"+color+"-dot.png"
},


title:
item.disaster_name



});



}


});


});


}



window.onload=initMap;


</script>


</body>

</html>

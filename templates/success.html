<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff,
                #e0f2fe
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .success-container {
            width: 450px;
            max-width: 100%;

            background: white;

            padding: 45px 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.12);

            border: 1px solid #e5e7eb;

            animation: appear 0.5s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 85px;
            height: 85px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #dcfce7;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 45px;

            box-shadow:
                0 8px 20px rgba(34, 197, 94, 0.15);
        }

        .success-container h1 {
            color: #166534;

            font-size: 30px;

            margin-bottom: 12px;
        }

        .success-container .message {
            color: #6b7280;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .buttons {
            display: flex;

            gap: 12px;

            justify-content: center;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.3s;
        }

        .login-btn {
            background: #2563eb;

            color: white;
        }

        .login-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.25);
        }

        .register-btn {
            background: #f3f4f6;

            color: #374151;
        }

        .register-btn:hover {
            background: #e5e7eb;

            transform: translateY(-2px);
        }

        .system-name {
            margin-top: 28px;

            font-size: 13px;

            color: #9ca3af;
        }

        @media (max-width: 500px) {

            .success-container {
                padding: 35px 25px;
            }

            .success-container h1 {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="success-container">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Registration Successful!
        </h1>

        <p class="message">
            Your account has been created successfully.
            You can now login to the Smart Disaster Management System.
        </p>

        <div class="buttons">

            <a href="/login" class="btn login-btn">
                Login Now
            </a>

            <a href="/register" class="btn register-btn">
                Register Another
            </a>

        </div>

        <p class="system-name">
            Smart Disaster Management System
        </p>

    </div>

</body>

</html>

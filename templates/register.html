<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Disaster Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff,
                #e0f2fe
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .register-container {
            width: 430px;
            max-width: 100%;

            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);

            border: 1px solid #e5e7eb;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 32px;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .register-header p {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 15px;
            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            font-size: 15px;
            color: #1f2937;

            background: #ffffff;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-group select {
            cursor: pointer;
        }

        .register-container button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: #ffffff;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }

        .register-container button:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.25);
        }

        .register-container button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
        }

        .login-link p {
            color: #6b7280;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .register-container {
                padding: 30px 22px;
                border-radius: 14px;
            }

            .register-header h1 {
                font-size: 27px;
            }

            .register-header p {
                font-size: 14px;
            }
        }
    </style>

</head>

<body>

    <div class="register-container">

        <div class="register-header">

            <h1>Create Account</h1>

            <p>
                Join the Smart Disaster Management System
            </p>

        </div>


        <form method="POST" action="/register">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label for="user_type">
                    Account Type
                </label>

                <select
                    id="user_type"
                    name="user_type"
                    required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="volunteer">
                        Volunteer
                    </option>

                </select>

            </div>


            <button type="submit">
                Create Account
            </button>


        </form>


        <div class="login-link">

            <p>
                Already have an account?

                <a href="/login">
                    Login
                </a>
            </p>

        </div>


    </div>

</body>

</html>
